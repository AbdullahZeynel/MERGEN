name: Checks

# Her PR ve main push'unda çalışır. Yol filtresi yok: repo koruması (sır,
# altyapı adresi, büyük dosya) yalnız belge değişen bir PR'da da geçmeli.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo koruması
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sır, altyapı adresi ve büyük dosya taraması
        run: python infra/ci/repo_guard.py
      - name: Guard kuralları testi
        run: python -m unittest discover -s infra/ci -p 'test_*.py'
      # GPU host katmanı: bağımlılık gerektirmez, geçici dizinde çalışır ve
      # hiçbir sistem aracını çağırmaz. Bu yüzden guard job'una eklendi.
      - name: GPU host sözleşme testleri
        run: python -m unittest discover -s infra/gpu-host -p 'test_*.py'
      - name: GPU host betikleri sözdizimi
        run: bash -n infra/gpu-host/*.sh infra/gpu-host/lib/*.sh

  backend:
    name: Backend ve MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Python adımlarından ÖNCE: deploy_frontend hashlib.file_digest (3.11+)
      # kullanıyor, runner'ın varsayılan yorumlayıcısına güvenilmez.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Demo ağ geçidi testleri
        run: python -m unittest backend.test_demo
      - name: Canlı oturum ve kuyruk testleri
        run: python -m unittest backend.test_live
      - name: VPS dağıtım testleri
        run: python -m unittest discover -s infra/vps -p 'test_*.py'
      - name: GPU spool sözleşmesi testleri
        run: python -m unittest discover -s mergen_spool -t .
      - name: GPU dispatcher testleri
        run: python -m unittest discover -s mergen_dispatcher -t .
      - name: Kurulum betikleri sözdizimi
        run: |
          bash -n infra/vps/package-frontend.sh
          bash -n infra/vps/install-services.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
