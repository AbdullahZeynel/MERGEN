name: Checks

# Her PR ve main push'unda çalışır. Yol filtresi yok: repo koruması (sır,
# altyapı adresi, büyük dosya) yalnız belge değişen bir PR'da da geçmeli.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo koruması
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sır, altyapı adresi ve büyük dosya taraması
        run: python infra/ci/repo_guard.py
      - name: Guard kuralları testi
        run: python -m unittest discover -s infra/ci -p 'test_*.py'
      # GPU host katmanı: bağımlılık gerektirmez, geçici dizinde çalışır ve
      # hiçbir sistem aracını çağırmaz. Bu yüzden guard job'una eklendi.
      # `discover -s infra/gpu-host` Python 3.13+'te reddediliyor: dizin adındaki
      # tire geçerli bir modül adı değil. Dizinin içinden çağırınca sürümden
      # bağımsız çalışıyor.
      - name: GPU host sözleşme testleri
        working-directory: infra/gpu-host
        run: python -m unittest discover -p 'test_*.py'
      - name: GPU host betikleri sözdizimi
        run: bash -n infra/gpu-host/*.sh infra/gpu-host/lib/*.sh

  backend:
    name: Backend ve MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Python adımlarından ÖNCE: deploy_frontend hashlib.file_digest (3.11+)
      # kullanıyor, runner'ın varsayılan yorumlayıcısına güvenilmez.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Demo ağ geçidi testleri
        run: python -m unittest backend.test_demo
      - name: Canlı oturum ve kuyruk testleri
        run: python -m unittest backend.test_live
      - name: VPS dağıtım testleri
        run: python -m unittest discover -s infra/vps -p 'test_*.py'
      - name: GPU spool sözleşmesi testleri
        run: python -m unittest discover -s mergen_spool -t .
      - name: GPU dispatcher testleri
        run: python -m unittest discover -s mergen_dispatcher -t .
      # GPU, model, ağ veya alt süreç gerektirmez; sahte adaptörle çalışır.
      - name: GPU executor testleri
        run: python -m unittest discover -s mergen_executor -t .
      # Ağırlık, torch veya görüntü bağımlılığı yüklemeden runner protokolü,
      # GLB ve sonuç ZIP sözleşmesini sınar.
      - name: Hafif model runner sözleşme testleri
        run: python -m unittest discover -s mergen_imaging -t .
      # Ürün kuralı (TC_MIN, review_flags) ve vaka hazırlığı torch'suz sınanır;
      # dizinin içinden çağrılır ki keşif Python sürümünden bağımsız çalışsın.
      - name: Görüntü kuralı ve veri yolu testleri
        run: |
          python -m pip install --disable-pip-version-check -r models/imaging/requirements-test.txt
          cd models/imaging && python -m unittest discover -p 'test_*.py'
      # Demo paketini üreten betiklerin testleri (vaka seçimi, GLB yazıcısı, mesh
      # göçü, v4 paketi). scipy/Pillow ister; GPU, ağırlık veya veri istemez.
      # Dizinin içinden çağrılır: `frontend/scripts` modül adı olarak geçersiz.
      - name: Demo paketi üretici testleri
        run: |
          python -m pip install --disable-pip-version-check -r frontend/scripts/requirements-demo.txt
          cd frontend/scripts && python -m unittest discover -p 'test_*.py'
      - name: Kurulum betikleri sözdizimi
        run: |
          bash -n infra/vps/package-frontend.sh
          bash -n infra/vps/install-services.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
