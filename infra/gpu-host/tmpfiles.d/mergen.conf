# MERGEN directory contract. Install to /usr/lib/tmpfiles.d/ and apply with
# `systemd-tmpfiles --create`. Running it twice only re-asserts the modes.
#
# Type `d` creates the directory if missing and corrects mode and ownership.
# Nothing here is age-based: no line may ever delete a file on its own.
#
# Runtime note: if /var/lib/mergen/runtime is a separate mount or subvolume,
# mount it before applying this file, otherwise tmpfiles creates a directory
# that the later mount hides.

d /opt/mergen              0755 root             mergen           -
d /srv/mergen-models       0750 mergen           mergen-svc       -
d /var/lib/mergen          0755 root             root             -
d /var/lib/mergen/dispatcher 0700 mergen-dispatcher mergen-dispatcher -
d /var/lib/mergen/executor   0700 mergen-executor   mergen-executor   -

# Dispatcher owns the runtime tree and creates one directory per job; the
# executor traverses it by group but cannot create new top-level job dirs.
# "Others" get nothing: this computer has other human users.
d /var/lib/mergen/runtime  0750 mergen-dispatcher mergen-executor  -

# Config root is traversable but not listable; the files inside carry the
# real protection.
d /etc/mergen              0751 root             root             -
