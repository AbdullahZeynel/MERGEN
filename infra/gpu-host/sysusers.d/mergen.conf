# MERGEN service accounts. Install to /usr/lib/sysusers.d/ and apply with
# `systemd-sysusers`. Declarative so a second run is a no-op.
#
# The maintenance account `mergen` is NOT declared here: it is a human login
# with a home directory and a shell, and creating human accounts implicitly on
# somebody's daily-use computer is the wrong default. install-base.sh creates
# it explicitly, with a locked password.
#
# /usr/sbin/nologin resolves on Debian/Ubuntu and on Arch (where /usr/sbin is a
# symlink to /usr/bin). Neither service account may ever gain a shell or sudo.

# Shared read group: lets both services read the versioned model tree without
# granting either of them write access to it.
g mergen-svc -

u mergen-dispatcher - "MERGEN GPU dispatcher" /var/lib/mergen/dispatcher /usr/sbin/nologin
u mergen-executor   - "MERGEN GPU executor"   /var/lib/mergen/executor   /usr/sbin/nologin

m mergen-dispatcher mergen-svc
m mergen-executor   mergen-svc
